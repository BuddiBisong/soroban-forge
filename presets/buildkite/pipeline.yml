# Generated by `soroban-forge ci-init --provider buildkite`.
# Buildkite pipeline for {{project_name}} — mirrors the GitHub build-test
# preset: runs the test suite, builds the contract wasm, and checks the
# built wasm's size against MAX_WASM_BYTES.

env:
  MAX_WASM_BYTES: "{{max_size}}"

steps:
  - label: ":rust: build & test"
    key: "build-and-test"
    command:
      - "rustup target add wasm32v1-none"
      - "cargo test"
      - "cargo build --target wasm32v1-none --release"
    plugins:
      - docker#v5.11.0:
          image: "rust:latest"

  - label: ":straight_ruler: contract size"
    key: "contract-size"
    depends_on: "build-and-test"
    command:
      - "cargo build --target wasm32v1-none --release"
      - |
        status=0
        found=0
        for wasm in target/wasm32v1-none/release/*.wasm; do
          [ -e "$$wasm" ] || continue
          found=1
          size_bytes=$$(wc -c < "$$wasm")
          echo "$$wasm: $${size_bytes} bytes (limit: $$MAX_WASM_BYTES bytes)"
          if [ "$$size_bytes" -gt "$$MAX_WASM_BYTES" ]; then
            echo "contract exceeds $$MAX_WASM_BYTES bytes"
            status=1
          fi
        done
        if [ "$$found" -eq 0 ]; then
          echo "no .wasm produced by the build"
          status=1
        fi
        exit "$$status"
    plugins:
      - docker#v5.11.0:
          image: "rust:latest"
